services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6380:6379"   # redis protocol (graph queries); 6380 on the host to avoid a local Redis
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  falkordb-data:
